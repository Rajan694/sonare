# Builds every app and publishes a GitHub release when a version tag is pushed:
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# The tag is made on this repo, whose submodule pointers say which frontend commit is built.
# The release carries the five fixed-name files the web intro page and the apps' update check
# read (buildFE.sh `prod all` -> dist/releases/github/). The frontend's version files must
# already say the tag's version (./release.sh writes them before tagging), so a local run,
# sonare.vip and these builds agree; Android's versionCode follows from it (1.2.0 -> 1002000).
# The notes are docs/release-notes/<tag>.md, else made from the commits (scripts/release-notes.sh);
# the apps show them under Settings -> About -> "What's new".
#
# Repository secrets (Settings -> Secrets and variables -> Actions), see docs/DEPLOYMENT.md:
#   ANDROID_KEYSTORE_BASE64        base64 of ~/.gradle/sonare-upload.keystore
#   SONARE_UPLOAD_STORE_PASSWORD   the keystore password
#   SONARE_UPLOAD_KEY_ALIAS        the key alias (sonare)
#   SONARE_UPLOAD_KEY_PASSWORD     the key password

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # The web bundle in `all` is built for production too.
      VITE_API_BASE_PROD: https://api.sonare.vip/api/v1
      # appimagetool is itself an AppImage; runners have no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The tags and the submodules' history, for the release notes.
          fetch-depth: 0

      - name: Submodule history
        run: git submodule foreach --quiet 'git fetch --quiet --unshallow origin || git fetch --quiet origin'

      - name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tags look like v1.2.0, not $GITHUB_REF_NAME"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: The frontend says the same version
        run: |
          cd sonare-frontend
          desktop="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' desktop/neutralino.config.json | head -1)"
          android="$(sed -n 's/^\s*versionName "\(.*\)"$/\1/p' mobile/android/app/build.gradle | head -1)"
          if [ "$desktop" != "$VERSION" ] || [ "$android" != "$VERSION" ]; then
            echo "::error::The frontend says desktop/web $desktop, Android $android, not $VERSION - ./release.sh $VERSION writes them"
            exit 1
          fi

      - name: Release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md" && cat "$RUNNER_TEMP/notes.md"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sonare-frontend/desktop/package-lock.json
            sonare-frontend/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The default package list includes "tools", which current SDK repositories no longer
      # have, so sdkmanager fails. The NDK matches mobile/android/build.gradle's ndkVersion;
      # Gradle fetches the SDK platform itself (licenses are accepted here).
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;27.1.12297006
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4

      - name: appimagetool
        run: |
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Packages and the Neutralino binaries
        run: |
          (cd sonare-frontend/desktop && npm ci && npx neu update)
          (cd sonare-frontend/mobile && npm ci)

      - name: Android signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SONARE_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SONARE_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SONARE_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::The Android signing secrets are missing (see docs/DEPLOYMENT.md)"
            exit 1
          fi
          mkdir -p ~/.gradle
          echo "$KEYSTORE" | base64 -d > ~/.gradle/sonare-upload.keystore
          {
            echo "SONARE_UPLOAD_STORE_FILE=$HOME/.gradle/sonare-upload.keystore"
            echo "SONARE_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "SONARE_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "SONARE_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> ~/.gradle/gradle.properties

      - name: Build every platform
        run: ./build.sh prod all "$VERSION"

      - name: Check the release set
        run: |
          cd sonare-frontend/dist/releases/github
          for f in sonare-android-arm64.apk sonare-linux-x64.AppImage sonare-linux-x64.deb \
                   sonare-linux-x64.tar.gz sonare-windows-x64.exe; do
            [ -s "$f" ] || { echo "::error::$f was not built"; exit 1; }
          done
          ls -l

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" sonare-frontend/dist/releases/github/* \
            --title "Sonare $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

      - name: Forget the signing key
        if: always()
        run: rm -f ~/.gradle/sonare-upload.keystore ~/.gradle/gradle.properties
